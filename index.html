<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 
        THE BRAIN OF THE PAGE (HEAD)
        - This part is invisible to the user.
        - It includes styles (CSS) and fonts.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Edu - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="bg-white p-2 rounded border shadow-sm"
        style="position: absolute; top: 10px; right: 10px; z-index: 1000;">
        <label class="text-muted d-block small mb-1" data-i18n="select_language">Language:</label>
        <select id="langSwitcher" class="form-select form-select-sm border-0 bg-light" style="width: auto;">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
        </select>
    </div>

    <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary" data-i18n="app_name">Smart Edu</h3>
                <p class="text-muted" data-i18n="subtitle">Low-bandwidth Learning Platform</p>
            </div>

            <div id="alertBox" class="alert alert-danger d-none text-break" role="alert"></div>

            <!-- 
                THE LOGIN FORM
                - User types email and password here.
                - When they click "Login", the Javascript at the bottom takes over.
            -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label" data-i18n="email">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com"
                        data-i18n="email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="********"
                        data-i18n="password">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" data-i18n="login_btn">Login</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <small class="text-muted" data-i18n="demo_creds">Demo Credentials:</small>

                <div class="mt-2 text-start small">
                    <p class="mb-1"><b data-i18n="student">Student</b> (IMSCIT):<br>
                        <code class="text-primary">asmi.imscit24@skipsuniversity.edu.in</code> /
                        <code>password123</code>
                    </p>

                    <p class="mb-1"><b data-i18n="student">Student</b> (BCA):<br>
                        <code class="text-primary">yug.bca24@skipsuniversity.edu.in</code> / <code>password123</code>
                    </p>

                    <p class="mb-0"><b data-i18n="teacher">Teacher</b>:<br>
                        <code class="text-primary">shruti.malde@skipsuniversity.edu.in</code> / <code>password123</code>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <!-- 
        LOGIN LOGIC (JAVASCRIPT)
        - This script runs when the user clicks 'Login'.
        - It sends the data to api/login.php and waits for a "Yes" or "No".
    -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Stop the page from refreshing automatically.
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            alertBox.classList.add('d-none'); // Hide any old error messages.

            try {
                // Talk to the backend (login.php)
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const text = await response.text();

                try {
                    const data = JSON.parse(text);
                    if (response.ok && data.success) {
                        // If login is successful, go to the correct dashboard.
                        if (data.role === 'student') window.location.href = 'student/dashboard.html';
                        else if (data.role === 'teacher') window.location.href = 'teacher/dashboard.html';
                    } else {
                        // If wrong credentials, show the error message.
                        const translatedMsg = window.i18n ? i18n.get(data.message) : data.message;
                        alertBox.innerHTML = `<strong>${window.i18n ? i18n.get('login_failed') : 'Login Failed'}:</strong> ${translatedMsg}`;
                        alertBox.setAttribute('data-i18n', data.message);
                        alertBox.classList.remove('d-none');
                    }
                } catch (jsonError) {
                    alertBox.innerHTML = `<strong>${window.i18n ? i18n.get('server_error') : 'Server Error'}:</strong><br>${text.substring(0, 100)}...`;
                    alertBox.classList.remove('d-none');
                }
            } catch (error) {
                alertBox.textContent = window.i18n ? i18n.get('network_error') : 'Network error.';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
