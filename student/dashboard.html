<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Smart Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <style>
        .nav-link {
            cursor: pointer;
            color: white;
            padding: 10px 15px;
            display: block;
            border-bottom: 1px solid #444;
            text-decoration: none;
        }

        .nav-link:hover {
            background: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="text-center mb-4 p-3">
            <h4 class="text-white">Smart Edu</h4>
            <h4 class="text-white" data-i18n="student_panel"> Student Panel </h4>
        </div>

        <a class="nav-link" onclick="loadView('dashboard')"><i class="fas fa-home me-2"></i> <span
                data-i18n="dashboard">Dashboard</span></a>
        <a class="nav-link" onclick="loadView('attendance')"><i class="fas fa-calendar-check me-2"></i> <span
                data-i18n="attendance">Attendance</span></a>
        <a class="nav-link" onclick="loadView('courses')"><i class="fas fa-book-open me-2"></i> <span
                data-i18n="courses">Courses</span></a>
        <a class="nav-link" onclick="loadView('assignments')"><i class="fas fa-tasks me-2"></i> <span
                data-i18n="assignments">Assignments</span></a>
        <a class="nav-link" onclick="loadView('ai_assistant')"><i class="fas fa-robot me-2"></i> <span
                data-i18n="ai_tutor">AI Tutor</span></a>
        <a class="nav-link" onclick="loadView('bookings')"><i class="fas fa-calendar-check me-2"></i> <span
                data-i18n="doubts_sessions">Doubt Sessions</span></a>

        <div class="mt-5 p-3">
            <button onclick="doLogout()" class="btn btn-outline-danger w-100"><i class="fas fa-sign-out-alt me-2"></i>
                <span data-i18n="logout">Logout</span></button>
        </div>
    </div>

    <div class="content">
        <nav class="navbar navbar-dark bg-dark mb-4 rounded shadow-sm px-3 py-2">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <span class="navbar-brand mb-0 h1 fs-5" data-i18n="student_portal">Student Portal</span>
                <div class="d-flex align-items-center">
                    <div class="bg-white p-1 px-2 rounded border me-3">
                        <small class="text-muted small me-1" style="font-size: 10px;"
                            data-i18n="select_language">Language:</small>
                        <select id="langSwitcher" class="border-0 bg-transparent fw-bold"
                            style="font-size: 11px; cursor: pointer; outline: none;">
                            <option value="en">EN</option>
                            <option value="hi">HI</option>
                            <option value="gu">GU</option>
                        </select>
                    </div>
                    <!-- Notifications will be injected here by notifications.js -->
                </div>
            </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2 id="pageTitle" data-i18n="my_dashboard">My Dashboard</h2>
            <span id="studentName" class="badge bg-secondary p-2">Loading...</span>
        </div>

        <div id="contentArea"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/student.js"></script>
</body>

</html>
