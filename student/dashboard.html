<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Smart Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <style>
        .nav-link {
            cursor: pointer;
            color: white;
            padding: 10px 15px;
            display: block;
            border-bottom: 1px solid #444;
            text-decoration: none;
        }

        .nav-link:hover {
            background: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="text-center mb-4 p-3">
            <h4 class="text-white">Smart Edu</h4>
            <small class="text-muted">Student Panel</small>
        </div>

        <a class="nav-link" onclick="loadView('dashboard')"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a class="nav-link" onclick="loadView('attendance')"><i class="fas fa-calendar-check me-2"></i> Attendance</a>
        <a class="nav-link" onclick="loadView('courses')"><i class="fas fa-book-open me-2"></i> Courses</a>
        <a class="nav-link" onclick="loadView('assignments')"><i class="fas fa-tasks me-2"></i> Assignments</a>
        <a class="nav-link" onclick="loadView('ai_assistant')"><i class="fas fa-robot me-2"></i> AI Tutor</a>

        <div class="mt-5 p-3">
            <button onclick="doLogout()" class="btn btn-outline-danger w-100"><i class="fas fa-sign-out-alt me-2"></i>
                Logout</button>
        </div>
    </div>

    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2 id="pageTitle">My Dashboard</h2>
            <span id="studentName" class="badge bg-secondary p-2">Loading...</span>
        </div>

        <div id="contentArea"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/student.js"></script>
</body>

</html>
